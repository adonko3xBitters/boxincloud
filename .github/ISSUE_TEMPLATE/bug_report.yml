name: Rapport de bug
description: Signaler un dysfonctionnement
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de prendre le temps de signaler ce problème.

        ⚠️ **Faille de sécurité ?** N'ouvrez pas d'issue publique — suivez
        [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Que se passe-t-il ?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Les étapes exactes pour reproduire le problème.
      placeholder: |
        1. Aller sur …
        2. Cliquer sur …
        3. Observer …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Composant
      options:
        - Serveur / API
        - Application web
        - Application mobile (Flutter)
        - Indexation / scan
        - Stockage (S3, MinIO, local…)
        - Lecteur
        - Déploiement / Docker
        - Je ne sais pas
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Résultat de `GET /api/v1/version`, ou le tag de l'image Docker.
      placeholder: "0.1.0 · commit a1b2c3d"
    validations:
      required: true

  - type: input
    id: storage
    attributes:
      label: Backend de stockage
      description: Type et fournisseur — souvent déterminant.
      placeholder: "S3 · Backblaze B2 · région eu-central"

  - type: textarea
    id: environment
    attributes:
      label: Environnement
      placeholder: |
        Déploiement : Docker Compose / Unraid / binaire
        OS hôte : Debian 12
        PostgreSQL : 17
        Navigateur ou appareil : Firefox 130 / Pixel 9, Android 15

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Extrait pertinent des logs du serveur. **Retirez les identifiants de
        stockage et les jetons avant de coller.**
      render: shell
