name: Publication mobile

# L'APK que le code QR de l'interface web propose au téléchargement.
#
# Publié sur les versions GitHub plutôt que servi par chaque instance : le
# fichier est identique partout, et l'embarquer ferait porter quelques dizaines
# de mégaoctets à toutes les installations self-hosted pour un usage rare.
#
# Le nom de l'artefact est un contrat : `apps/web/src/lib/mobile-app.ts` y
# renvoie via l'alias `latest`, sans numéro de version. Le renommer casserait
# silencieusement le bouton de téléchargement de toutes les instances déjà
# déployées.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: APK de release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # La signature est obligatoire ici, contrairement au développement local.
      # Un APK signé avec la clé de debug s'installe, mais fige l'identité de
      # l'application sur une clé publiquement connue : plus aucune mise à jour
      # signée autrement ne pourrait ensuite s'installer par-dessus.
      - name: Vérifier les secrets de signature
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 manquant. Voir docs/03-repo-structure.md, section « Publication mobile »."
            exit 1
          fi

      - name: Écrire la clé de signature
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: apps/mobile/android
        run: |
          echo "$KEYSTORE" | base64 --decode > release.jks
          cat > key.properties <<EOF
          storeFile=release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Dépendances
        working-directory: apps/mobile
        run: flutter pub get

      - name: Construire l'APK
        working-directory: apps/mobile
        run: flutter build apk --release

      # Un nom stable, indépendant de la version : c'est ce nom que l'alias
      # `releases/latest/download/` résout.
      - name: Renommer
        run: |
          mv apps/mobile/build/app/outputs/flutter-apk/app-release.apk \
             boxincloud-android.apk

      - name: Effacer la clé de signature
        if: always()
        working-directory: apps/mobile/android
        run: rm -f release.jks key.properties

      - name: Publier
        uses: softprops/action-gh-release@v2
        with:
          files: boxincloud-android.apk
          fail_on_unmatched_files: true
