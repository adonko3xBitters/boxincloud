name: Publication mobile

# L'APK que le code QR de l'interface web propose au téléchargement.
#
# Publié sur les versions GitHub plutôt que servi par chaque instance : le
# fichier est identique partout, et l'embarquer ferait porter quelques dizaines
# de mégaoctets à toutes les installations self-hosted pour un usage rare.
#
# Le nom de l'artefact est un contrat : `apps/web/src/lib/mobile-app.ts` y
# renvoie via l'alias `latest`, sans numéro de version. Le renommer casserait
# silencieusement le bouton de téléchargement de toutes les instances déjà
# déployées.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: APK de release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Sans clé de release, la construction retombe sur la clé de debug plutôt
      # que d'échouer — un choix délibéré et temporaire, pour que le code QR de
      # l'interface web mène à quelque chose dès la première version.
      #
      # Ce n'est pas anodin : Android identifie une application par sa clé
      # autant que par son identifiant, et la clé de debug est publiquement
      # connue. Le passage à une vraie clé exigera donc une désinstallation.
      # C'est pourquoi l'APK non signé porte un autre nom et que la version le
      # dit — personne ne doit l'installer en croyant qu'il se mettra à jour.
      - name: Déterminer le mode de signature
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: apps/mobile/android
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::Aucune clé de release. APK signé avec la clé de debug — voir docs/03-repo-structure.md, section « Publication mobile »."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "$KEYSTORE" | base64 --decode > release.jks
          cat > key.properties <<EOF
          storeFile=release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Dépendances
        working-directory: apps/mobile
        run: flutter pub get

      - name: Construire l'APK
        working-directory: apps/mobile
        run: flutter build apk --release

      # Un nom stable, indépendant de la version : c'est ce nom que l'alias
      # `releases/latest/download/` résout, et sur lequel pointe
      # `apps/web/src/lib/mobile-app.ts`.
      #
      # L'APK non signé porte un nom différent, exprès. La page de
      # téléchargement essaie le nom signé d'abord et n'affiche l'autre qu'en
      # le disant : un fichier de test ne doit pas s'installer par surprise.
      - name: Renommer
        run: |
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            mv apps/mobile/build/app/outputs/flutter-apk/app-release.apk \
               boxincloud-android.apk
          else
            mv apps/mobile/build/app/outputs/flutter-apk/app-release.apk \
               boxincloud-android-non-signe.apk
          fi

      - name: Effacer la clé de signature
        if: always()
        working-directory: apps/mobile/android
        run: rm -f release.jks key.properties

      - name: Publier
        uses: softprops/action-gh-release@v2
        with:
          files: boxincloud-android*.apk
          fail_on_unmatched_files: true
