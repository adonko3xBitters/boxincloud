name: CI · serveur

on:
  push:
    branches: [main]
    paths:
      - "apps/server/**"
      - "api/**"
      - ".github/workflows/ci-server.yml"
  pull_request:
    paths:
      - "apps/server/**"
      - "api/**"
      - ".github/workflows/ci-server.yml"

concurrency:
  group: ci-server-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/server/go.sum

      - name: go vet
        working-directory: apps/server
        run: go vet ./...

      - name: gofmt
        working-directory: apps/server
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Fichiers non formatés — lancez 'make fmt' :"
            echo "$unformatted"
            exit 1
          fi

      # v9 et une version explicite, pas `latest`.
      #
      # `latest` sur l'action v6 installait golangci-lint v1.64.8 — la dernière
      # des v1. Or `.golangci.yml` déclare `version: "2"`, que v1 ne sait pas
      # lire, et ce binaire est compilé avec Go 1.24 quand le module cible
      # 1.26.5 :
      #
      #   can't load config: the Go language version (go1.24) used to build
      #   golangci-lint is lower than the targeted Go version (1.26.5)
      #
      # L'étape échouait donc à chaque exécution sans jamais analyser une ligne,
      # ce qui est pire qu'une analyse absente : la CI paraissait sévère alors
      # qu'elle ne vérifiait rien.
      #
      # La version est FIXÉE plutôt que flottante. Deux pannes de la même
      # famille sont apparues le même jour — celle-ci, et une image Flutter
      # `:stable` qui avait pris du retard. Un outil qui avance tout seul finit
      # par casser une publication sans qu'une ligne de code ait bougé.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: apps/server

  test:
    name: Tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/server/go.sum

      # p7zip est libre, contrairement à `rar` : le test du CB7 s'exécute donc
      # réellement ici, là où il se saute sur une machine de développement qui
      # ne l'a pas.
      - name: Outils d'archive
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Tests
        working-directory: apps/server
        run: go test ./... -race -short -coverprofile=coverage.out

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: apps/server/coverage.out

  integration:
    name: Tests d'intégration
    runs-on: ubuntu-latest
    # Ces tests tournent contre un vrai PostgreSQL et un vrai MinIO via
    # testcontainers. Un mock de S3 ne reproduit ni le comportement des
    # requêtes Range, ni les codes d'erreur, ni la sémantique des ETag —
    # c'est-à-dire précisément ce qui nous intéresse.
    #
    # Ils incluent le test de contrat, qui valide chaque réponse du serveur réel
    # contre api/openapi.yaml. Une divergence entre le contrat publié et
    # l'implémentation fait échouer la CI — avant que les clients TypeScript et
    # Dart, générés depuis le fichier, ne partent avec de mauvais types.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/server/go.sum

      - name: Tests d'intégration
        working-directory: apps/server
        run: go test ./... -race -run Integration -count=1

  generate-check:
    name: Code généré à jour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/server/go.sum

      - name: Installer les générateurs
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest
          go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@latest

      - name: Régénérer
        run: make generate

      - name: Vérifier l'absence de diff
        run: |
          if ! git diff --exit-code; then
            echo "::error::Code généré obsolète. Lancez 'make generate' et committez le résultat."
            exit 1
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/server/go.sum

      - name: Compiler
        run: make build

      - name: Vérifier que le binaire démarre
        run: ./bin/boxincloudctl version
