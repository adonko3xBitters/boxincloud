name: CI mobile

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "api/openapi.yaml"
      - "packages/design-tokens/**"
      - "tools/generate-dart-models.mjs"
      - "tools/generate-app-icons.mjs"
      - "apps/web/public/icon.svg"
      - ".github/workflows/ci-mobile.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - "api/openapi.yaml"
      - "packages/design-tokens/**"
      - "tools/generate-dart-models.mjs"
      - "tools/generate-app-icons.mjs"
      - "apps/web/public/icon.svg"

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyse et tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      # Les sources dérivées sont versionnées : la CI vérifie qu'elles
      # correspondent bien à leurs sources. Sans ce contrôle, un contrat modifié
      # sans régénération laisserait le client mobile décoder des réponses qu'il
      # ne comprend plus — et cela ne se verrait qu'à l'exécution.
      - name: Sources dérivées à jour
        working-directory: .
        run: |
          node tools/generate-dart-models.mjs
          node packages/design-tokens/build.mjs
          if ! git diff --exit-code -- apps/mobile/lib; then
            echo "::error::Modèles ou tokens Dart obsolètes. Lancez 'make generate' et committez."
            exit 1
          fi

      - name: Code Drift à jour
        run: |
          dart run build_runner build
          if ! git diff --exit-code -- lib; then
            echo "::error::Code Drift obsolète. Lancez 'dart run build_runner build' et committez."
            exit 1
          fi

      # Les icônes de lancement sont produites par tools/generate-app-icons.mjs,
      # qui dépend de `sharp` — installé côté web, pas ici. Elles sont donc
      # versionnées, et ce contrôle vérifie seulement qu'elles ne sont pas
      # redevenues celles du gabarit Flutter.
      #
      # C'est le défaut exact qui a été publié en 0.1.0 et 0.1.1 : le projet
      # avait une icône, elle n'était branchée nulle part, et l'application
      # s'installait sous le logo bleu de Flutter. Rien ne le signalait.
      - name: Les icônes ne sont pas celles du gabarit Flutter
        working-directory: apps/mobile/android/app/src/main/res
        run: |
          # Empreintes des cinq PNG livrés par `flutter create`.
          template="
          7d18d43e4eb8fe59ea46cf51cc659be6a7f4cab5
          ea2b064031f64e11892f4dedc3e43c373b97c645
          45963ffb5dda7e9df4a26eda4459111d7bf1fe94
          e373f4f6fa753c8a6df8465b1a70f2a749c202c8
          dd0452802ca0cd6c81b9b5982aeb56b051b73829
          "
          failed=0

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            for icon in ic_launcher ic_launcher_foreground; do
              path="mipmap-$density/$icon.png"
              if [ ! -f "$path" ]; then
                echo "::error::$path manque. Lancez : node tools/generate-app-icons.mjs"
                failed=1
                continue
              fi
              sum=$(sha1sum "$path" | cut -d' ' -f1)
              if echo "$template" | grep -q "$sum"; then
                echo "::error::$path est l'icône du gabarit Flutter. Lancez : node tools/generate-app-icons.mjs"
                failed=1
              fi
            done
          done

          for declaration in mipmap-anydpi-v26/ic_launcher.xml values/ic_launcher_background.xml; do
            if [ ! -f "$declaration" ]; then
              echo "::error::$declaration manque : l'icône adaptative ne serait pas déclarée."
              failed=1
            fi
          done

          [ "$failed" -eq 0 ] && echo "Icônes propres au projet, icône adaptative déclarée."
          exit $failed

      - name: Analyse statique
        run: flutter analyze

      - name: Tests
        run: flutter test

  build:
    name: APK de release
    runs-on: ubuntu-latest
    needs: analyze
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Compiler pour de vrai : l'analyse statique ne dit rien des dépendances
      # natives — SQLite, trousseau système — qui ne se révèlent qu'à l'édition
      # de liens.
      #
      # En RELEASE, et c'est le point : c'est la variante que l'image Docker
      # embarque et que les utilisateurs installent. Ce job construisait le
      # debug, qui diffère précisément là où le défaut se logeait — Flutter
      # injecte la permission INTERNET dans les manifestes debug et profile,
      # pas dans celui de main. La CI validait donc le seul APK incapable de
      # révéler le problème.
      - name: Construire l'APK
        run: flutter build apk --release

      # Inspecter l'artefact lui-même, pas les sources : ce qui compte est ce
      # que le manifeste fusionné contient une fois l'APK assemblé.
      #
      # Un APK sans INTERNET s'installe et démarre normalement. Il n'échoue
      # qu'à la première requête, sur un message d'erreur qui désigne le
      # réseau ou le serveur — jamais l'application. Rien, en amont, ne le
      # signale.
      - name: L'APK déclare ses accès réseau
        run: |
          aapt2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -1)
          apk=build/app/outputs/flutter-apk/app-release.apk
          echo "aapt2 : $aapt2"

          permissions=$($aapt2 dump permissions "$apk")
          echo "$permissions"

          if ! echo "$permissions" | grep -q 'android.permission.INTERNET'; then
            echo "::error::L'APK de release ne déclare pas INTERNET. L'application ne pourra joindre aucun serveur ; elle échouera sur « serveur injoignable » après une installation en apparence réussie."
            exit 1
          fi

          # Le trafic en clair reste indispensable tant qu'une instance
          # auto-hébergée peut vivre en http sur un réseau local ou une IP nue.
          # Le perdre casserait ces installations sans autre symptôme qu'un
          # échec de connexion.
          if ! $aapt2 dump xmltree "$apk" --file AndroidManifest.xml \
               | grep -q 'networkSecurityConfig'; then
            echo "::error::L'APK de release ne référence plus de network_security_config. Les serveurs en http deviendront injoignables."
            exit 1
          fi

          echo "INTERNET déclaré, politique réseau présente."

      - uses: actions/upload-artifact@v4
        with:
          name: boxincloud-release-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
