name: CI mobile

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "api/openapi.yaml"
      - "packages/design-tokens/**"
      - "tools/generate-dart-models.mjs"
      - ".github/workflows/ci-mobile.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - "api/openapi.yaml"
      - "packages/design-tokens/**"
      - "tools/generate-dart-models.mjs"

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyse et tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      # Les sources dérivées sont versionnées : la CI vérifie qu'elles
      # correspondent bien à leurs sources. Sans ce contrôle, un contrat modifié
      # sans régénération laisserait le client mobile décoder des réponses qu'il
      # ne comprend plus — et cela ne se verrait qu'à l'exécution.
      - name: Sources dérivées à jour
        working-directory: .
        run: |
          node tools/generate-dart-models.mjs
          node packages/design-tokens/build.mjs
          if ! git diff --exit-code -- apps/mobile/lib; then
            echo "::error::Modèles ou tokens Dart obsolètes. Lancez 'make generate' et committez."
            exit 1
          fi

      - name: Code Drift à jour
        run: |
          dart run build_runner build
          if ! git diff --exit-code -- lib; then
            echo "::error::Code Drift obsolète. Lancez 'dart run build_runner build' et committez."
            exit 1
          fi

      - name: Analyse statique
        run: flutter analyze

      - name: Tests
        run: flutter test

  build:
    name: APK de debug
    runs-on: ubuntu-latest
    needs: analyze
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Compiler pour de vrai : l'analyse statique ne dit rien des dépendances
      # natives — SQLite, trousseau système — qui ne se révèlent qu'à l'édition
      # de liens.
      - name: Construire l'APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: boxincloud-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
