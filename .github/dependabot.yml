version: 2

updates:
  - package-ecosystem: gomod
    directory: /apps/server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Les mises à jour de patch arrivent groupées : une PR par semaine plutôt
      # qu'une dizaine à relire séparément.
      go-patches:
        update-types: ["patch"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci(deps)"
