# Standard Ebooks — gabarit d'exemple, sur un site réel.
#
# ─── À quoi il sert ──────────────────────────────────────────────────────────
#
# À voir un gabarit qui MARCHE, et à s'en servir de point de départ. Les
# sélecteurs ci-dessous ont été relevés sur les vraies pages du site et
# vérifiés par un test qui les applique à des pages enregistrées
# (apps/server/internal/discovery/scraper/example_test.go).
#
# Pour l'activer :
#
#   BOXINCLOUD_SCRAPER_TEMPLATES_DIR=deploy/scraper-templates
#
# puis, dans Configuration → Catalogues fédérés, « Standard Ebooks » apparaît
# dans le menu « Type de catalogue ».
#
# ─── Pourquoi ce site, et pourquoi c'est discutable ──────────────────────────
#
# Standard Ebooks publie des livres du domaine public, magnifiquement composés,
# sous licence CC0. Il coche donc le critère d'admission sans discussion.
#
# Mais il publie AUSSI un flux OPDS, et pour un usage réel c'est la bonne route :
# un flux structuré ne casse pas quand le site change de mise en page. Ce gabarit
# est donc pédagogique, et il l'assume — on apprend mieux sur un site qu'on peut
# ouvrir dans son navigateur pour comparer.
#
# C'est aussi la raison pour laquelle il n'est PAS livré dans le binaire : les
# gabarits embarqués sont réservés aux sites qui n'ont pas d'alternative.
#
# ─── Ce que son robots.txt autorise ──────────────────────────────────────────
#
# Vérifié : le groupe `User-agent: *` ne ferme que `/honeypot`. La restriction
# `/ebooks/*/downloads/*` vise un second groupe, nommant six robots de
# référencement — elle ne s'applique pas à nous. Recherche et téléchargements
# sont donc ouverts.
#
# Le moteur applique cette règle tout seul, y compris la subtilité qui la rend
# facile à lire de travers : un groupe nommé REMPLACE le groupe générique, il ne
# s'y ajoute pas.

id: standardebooks
name: Standard Ebooks
homepage: https://standardebooks.org
license: Domaine public, éditions sous CC0

mirrors:
  - https://standardebooks.org

# Un site tenu par des bénévoles. On lui parle une fois par seconde, pas plus.
rate:
  every: 1s
  burst: 2

limits:
  timeout: 10s
  budget: 30s
  maxResults: 30
  # Le lien de téléchargement n'est que sur la fiche : chaque résultat coûte une
  # requête de plus. C'est cette borne qui empêche une recherche large de se
  # transformer en trente visites.
  followDetail: 6

search:
  method: GET
  path: /ebooks
  query:
    query: "{terms}"
  # Un auteur que le site aura toujours : l'essai doit rendre quelque chose,
  # sinon il déclare cassé un gabarit qui fonctionne.
  probe: verne

results:
  # La ligne, pas la page. Chaque champ est ensuite cherché À L'INTÉRIEUR d'elle.
  select: "ol.ebooks-list > li"

  fields:
    # Le titre et l'auteur portent tous deux `property="schema:name"`. Ce qui
    # les distingue est leur paragraphe : celui de l'auteur a une classe, celui
    # du titre n'en a pas. D'où le `:not([class])`, qui vaut mieux qu'un
    # `:first-child` — une position casse au premier remaniement, une absence
    # de classe beaucoup moins.
    title:
      select: 'p:not([class]) span[property="schema:name"]'

    pageUrl:
      select: "p:not([class]) a"
      from: attr
      attr: href

    authors:
      select: 'p.author span[property="schema:name"]'
      all: true

    # `<picture>` propose de l'AVIF et du JPEG ; `<img>` porte le repli, qui est
    # celui que tout le monde sait afficher.
    coverUrl:
      select: "div.thumbnail-container img"
      from: attr
      attr: src

# La liste ne porte aucun lien de téléchargement : il faut ouvrir la fiche.
detail:
  from: pageUrl
  # Rien n'est suivi si la ligne a déjà ce qu'il faut. Ici elle ne l'a jamais,
  # mais la règle est écrite quand même : c'est elle qui ramène le coût à zéro
  # le jour où le site publierait les liens dans sa liste.
  onlyIfMissing: [acquisition]

  fields:
    # `a.epub` cible l'EPUB simple. Le site sert aussi de l'AZW3, du KEPUB et
    # une variante « advanced » : les prendre tous donnerait quatre lignes pour
    # le même livre, et l'utilisateur choisirait entre des formats dont trois ne
    # l'intéressent pas.
    acquisition:
      select: "a.epub[property='schema:contentUrl']"
      from: attr
      attr: href
      mediaType: application/epub+zip

    summary:
      select: "section#description p"
