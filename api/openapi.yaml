openapi: 3.0.3

info:
  title: boxincloud API
  version: 0.1.0-dev
  description: |
    Bibliothèque de BD, comics et mangas sur stockage objet.

    Contrat de l'API boxincloud.

    **Ce fichier est la source de vérité.** Le serveur Go, le client TypeScript
    du web et le client Dart de l'application Flutter en sont générés
    (`make generate`). Toute évolution de l'API commence ici — jamais par le
    code, sinon les clients divergent.

    Un test de contrat (`internal/httpapi/contract_test.go`) valide chaque
    réponse du serveur réel contre ce schéma : une divergence entre le contrat
    et l'implémentation fait échouer la CI.

    ## Erreurs

    Les erreurs suivent la [RFC 9457](https://www.rfc-editor.org/rfc/rfc9457)
    (`application/problem+json`). Le champ `type` est stable : les clients
    peuvent s'appuyer dessus pour brancher leur comportement. Deux valeurs
    méritent un traitement particulier :

    - `.../token-expired` — le jeton d'accès a expiré, rafraîchir puis rejouer ;
    - `.../session-revoked` — la session est révoquée, redemander une connexion
      complète (une réutilisation de refresh token a été détectée).

    ## Pagination

    Pagination par curseur. Le client renvoie `nextCursor` tel quel dans le
    paramètre `cursor` ; il ne doit jamais le construire ni l'interpréter.
    L'absence de `nextCursor` signifie « dernière page ».

    ## Versionnement

    Le préfixe `/api/v1` change uniquement en cas de rupture. Les ajouts
    rétrocompatibles se font dans la même version. Voir `api/README.md`.
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.html

servers:
  - url: /api/v1
    description: Instance courante

tags:
  - name: system
    description: Santé, version et diagnostic
  - name: auth
    description: Installation, connexion, sessions et appareils
  - name: catalog
    description: Bibliothèques, séries et albums
  - name: reader
    description: Lecture — manifeste, pages et couvertures
  - name: progress
    description: Progression de lecture et synchronisation
  - name: ed2k
    description: |
      Module eD2k/Kad — pilotage d'un démon aMule.

      boxincloud ne réimplémente aucun protocole pair-à-pair : ces routes
      commandent un démon `amuled` par son protocole External Connections, et
      n'en exposent jamais les détails. Aucun opcode, aucun nom de tag et aucune
      valeur empruntée au démon n'apparaît dans ce contrat.

      Le module est **désactivé par défaut** (`BOXINCLOUD_ED2K_ENABLED=false`).
      Désactivé, il répond quand même : `GET /ed2k/status` renvoie l'état
      `disabled`, et les routes qui agissent répondent 409.

security:
  - bearerAuth: []

paths:
  # ─── Système ────────────────────────────────────────────────────────────────

  /version:
    get:
      operationId: getVersion
      summary: Version du serveur
      description: |
        Retourne la version du binaire en cours d'exécution. Utilisé par les
        clients pour détecter une incompatibilité et proposer une mise à jour.
      tags: [system]
      security: []
      responses:
        "200":
          description: Informations de build
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuildInfo" }

  # ─── Authentification ───────────────────────────────────────────────────────

  /auth/status:
    get:
      operationId: getAuthStatus
      summary: État de l'instance
      description: |
        Indique si l'instance n'a encore aucun compte. L'application web s'en
        sert pour décider entre l'assistant de première installation et l'écran
        de connexion.
      tags: [auth]
      security: []
      responses:
        "200":
          description: État de l'instance
          content:
            application/json:
              schema:
                type: object
                required: [needsSetup]
                properties:
                  needsSetup:
                    type: boolean
                    description: Vrai tant qu'aucun compte n'existe.

  /auth/setup:
    post:
      operationId: setup
      summary: Créer le premier administrateur
      description: |
        Ouvert sans authentification tant qu'aucun compte n'existe — c'est le
        seul moyen d'amorcer une instance neuve. Répond 403 dès qu'un compte a
        été créé.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 32
                  description: Lettres, chiffres, tiret, point et souligné.
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 10
                  format: password
      responses:
        "201":
          description: Administrateur créé
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /auth/login:
    post:
      operationId: login
      summary: Ouvrir une session
      description: |
        Retourne un jeton d'accès de courte durée et un refresh token.

        `deviceId` est facultatif au premier appel : le serveur en crée un et le
        retourne. Le client le conserve pour que ses reconnexions soient
        rattachées au même appareil.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
                deviceId:
                  type: string
                  format: uuid
                  description: Appareil existant. Omis, un nouvel appareil est créé.
                deviceName:
                  type: string
                  description: Nom lisible, affiché dans la liste des appareils.
                platform:
                  $ref: "#/components/schemas/DevicePlatform"
                appVersion: { type: string }
      responses:
        "200":
          description: Session ouverte
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tokens" }
        "401":
          description: |
            Identifiants invalides. La réponse est identique que le compte
            n'existe pas ou que le mot de passe soit erroné — distinguer les
            deux permettrait d'énumérer les comptes.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /auth/refresh:
    post:
      operationId: refreshTokens
      summary: Renouveler les jetons
      description: |
        Échange un refresh token contre un nouveau couple. Le jeton présenté est
        révoqué — rotation systématique.

        Si un jeton déjà tourné est présenté, c'est qu'il a été volé : toute la
        chaîne de rotation est révoquée et la réponse porte le type
        `.../session-revoked`. Le client doit alors redemander une connexion
        complète.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: Nouveaux jetons
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tokens" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /auth/logout:
    post:
      operationId: logout
      summary: Fermer une session
      description: |
        Idempotent : un jeton inconnu, déjà révoqué ou expiré n'est pas une
        erreur. Un client hors ligne au moment de la déconnexion peut rejouer sa
        requête plus tard.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "204":
          description: Session fermée

  /me:
    get:
      operationId: getCurrentUser
      summary: Compte courant
      tags: [auth]
      responses:
        "200":
          description: Compte courant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/devices:
    get:
      operationId: listDevices
      summary: Appareils connectés
      tags: [auth]
      responses:
        "200":
          description: Liste des appareils
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    items: { $ref: "#/components/schemas/Device" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/devices/{deviceId}:
    delete:
      operationId: revokeDevice
      summary: Révoquer un appareil
      description: |
        Révoque les sessions d'un seul appareil, sans toucher aux autres.

        C'est le geste utile après un téléphone perdu : « tout déconnecter »
        oblige à se reconnecter partout, y compris là où on est en train de
        lire. Révoquer l'appareil courant est permis — cela revient à se
        déconnecter.
      tags: [auth]
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Sessions de l'appareil révoquées
          content:
            application/json:
              schema:
                type: object
                required: [revokedSessions]
                properties:
                  revokedSessions: { type: integer, format: int64 }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /me/logout-all:
    post:
      operationId: logoutAllDevices
      summary: Révoquer toutes les sessions
      tags: [auth]
      responses:
        "200":
          description: Sessions révoquées
          content:
            application/json:
              schema:
                type: object
                required: [revokedSessions]
                properties:
                  revokedSessions: { type: integer, format: int64 }
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ─── Catalogue ──────────────────────────────────────────────────────────────

  /home:
    get:
      operationId: getHome
      summary: Étagères d'accueil
      description: |
        Regroupe les étagères de la page d'accueil. « Reprendre la lecture » est
        servi séparément par `/continue-reading` : il relève de la progression,
        dont le catalogue ne dépend pas.
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Étagères
          content:
            application/json:
              schema:
                type: object
                required: [recent, nextInSeries]
                properties:
                  recent:
                    type: array
                    items: { $ref: "#/components/schemas/Comic" }
                  nextInSeries:
                    description: Premier album non lu de chaque série entamée.
                    type: array
                    items: { $ref: "#/components/schemas/Comic" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /search:
    get:
      operationId: search
      summary: Rechercher dans la bibliothèque
      description: |
        Recherche plein texte combinée à une similarité trigramme, insensible
        aux accents : « asterix » trouve « Astérix », « asterics » aussi.

        Une requête de moins de deux caractères retourne des listes vides.
      tags: [catalog]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
          description: Termes recherchés.
        - $ref: "#/components/parameters/LibraryId"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Résultats
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResults" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /libraries:
    post:
      operationId: createLibrary
      summary: Créer une bibliothèque sur un backend existant
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, backendId]
              properties:
                name: { type: string }
                backendId: { type: string, format: uuid }
                kind:
                  type: string
                  enum: [comic, manga, book, mixed]
                  description: "Défaut : comic."
                rootPrefix:
                  type: string
                  description: |
                    Préfixe sous lequel la bibliothèque vit dans le backend.
                    Vide pour la racine.
      responses:
        "201":
          description: Bibliothèque créée
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryDetail" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

    get:
      operationId: listLibraries
      summary: Bibliothèques visibles
      description: |
        Seules les bibliothèques auxquelles le compte a accès sont retournées.
        Une bibliothèque sans restriction est visible de tous.
      tags: [catalog]
      responses:
        "200":
          description: Bibliothèques
          content:
            application/json:
              schema:
                type: object
                required: [libraries]
                properties:
                  libraries:
                    type: array
                    items: { $ref: "#/components/schemas/Library" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /series:
    get:
      operationId: listSeries
      summary: Lister les séries
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/LibraryId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page de séries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeriesPage" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /series/{seriesId}:
    get:
      operationId: getSeries
      summary: Détail d'une série
      tags: [catalog]
      parameters:
        - name: seriesId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Série et ses albums, dans l'ordre de lecture
          content:
            application/json:
              schema:
                type: object
                required: [series, comics]
                properties:
                  series: { $ref: "#/components/schemas/Series" }
                  comics:
                    type: array
                    items: { $ref: "#/components/schemas/Comic" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /comics:
    get:
      operationId: listComics
      summary: Lister les albums
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/LibraryId"
        - name: seriesId
          in: query
          schema: { type: string, format: uuid }
        - name: state
          in: query
          schema: { $ref: "#/components/schemas/ComicState" }
        - name: readStatus
          in: query
          description: |
            Filtre sur la progression de lecture du compte courant. Omis ou
            vide, aucun filtre. `unread` inclut les albums jamais ouverts,
            qui n'ont aucune ligne de progression.
          schema:
            type: string
            enum: ["", unread, in_progress, read]
        - name: sort
          in: query
          description: |
            Ordre d'affichage. Défaut `recent`.

            Le curseur est lié au tri : le changer invalide la position
            précédente, et le serveur repart alors du début plutôt que de
            servir des résultats incohérents.
          schema:
            type: string
            enum: [recent, title, released]
        - name: folder
          in: query
          description: |
            Restreint à un dossier et à ses sous-dossiers. La chaîne vide
            désigne la racine de la bibliothèque, ce qui est distinct de
            l'absence du paramètre.
          schema: { type: string }
        - name: favorites
          in: query
          description: Ne retourne que les albums mis en favori.
          schema: { type: boolean }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page d'albums
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComicPage" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /accounts:
    get:
      operationId: listAccounts
      summary: Comptes du serveur
      tags: [accounts]
      responses:
        "200":
          description: Comptes
          content:
            application/json:
              schema:
                type: object
                required: [accounts]
                properties:
                  accounts:
                    type: array
                    items: { $ref: "#/components/schemas/Account" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      operationId: createAccount
      summary: Ouvrir un compte
      tags: [accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                email: { type: string }
                password:
                  type: string
                  minLength: 12
                  description: |
                    Douze caractères minimum. La longueur est la seule règle :
                    exiger majuscules et chiffres pousse surtout à des variantes
                    prévisibles du même mot.
                role:
                  type: string
                  enum: [admin, user]
                  description: "Défaut : user."
                displayName: { type: string }
      responses:
        "201":
          description: Compte créé
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /accounts/{userId}:
    patch:
      operationId: updateAccount
      summary: Modifier un compte
      description: |
        Profil, rôle, restriction et mot de passe en une requête : ce sont
        quatre réglages d'une même fiche, et les séparer obligerait l'interface
        à gérer quatre échecs partiels pour un seul formulaire.

        Deux garde-fous refusent la requête : on ne se retire pas ses propres
        droits d'administrateur, et on ne rétrograde pas le dernier
        administrateur — l'instance deviendrait inadministrable, sans retour
        possible depuis l'interface.
      tags: [accounts]
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string }
                email: { type: string }
                role: { type: string, enum: [admin, user] }
                restricted:
                  type: boolean
                  description: |
                    Profil restreint. La classification maximale n'est prise en
                    compte que sur un profil restreint.
                maxAgeRating: { type: integer }
                password: { type: string, minLength: 12 }
      responses:
        "200":
          description: Compte modifié
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

    delete:
      operationId: deleteAccount
      summary: Désactiver un compte
      description: |
        Suppression douce : la progression de lecture, les favoris et les notes
        restent attachés à l'identifiant. Les effacer priverait d'historique un
        compte rouvert plus tard, et fausserait les compteurs d'une bibliothèque
        partagée.

        Les sessions du compte sont révoquées : un compte désactivé ne doit pas
        continuer de lire avec un jeton encore valide.
      tags: [accounts]
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
      responses:
        "204":
          description: Compte désactivé
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /accounts/{userId}/library-access:
    get:
      operationId: listAccountAccess
      summary: Bibliothèques explicitement ouvertes à un compte
      tags: [accounts]
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
      responses:
        "200":
          description: Accès
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryGrants" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /libraries/{libraryId}/access:
    get:
      operationId: listLibraryAccess
      summary: Comptes autorisés sur une bibliothèque
      tags: [accounts]
      parameters:
        - $ref: "#/components/parameters/LibraryIdPath"
      responses:
        "200":
          description: Accès
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryGrants" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      operationId: grantLibraryAccess
      summary: Ouvrir une bibliothèque à un compte
      description: |
        **Attention au modèle** : une bibliothèque SANS aucune autorisation
        explicite est visible de tous. Le premier accès accordé la referme donc
        pour tous les autres comptes.
      tags: [accounts]
      parameters:
        - $ref: "#/components/parameters/LibraryIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string, format: uuid }
                canWrite:
                  type: boolean
                  description: Autorise le dépôt et la modification.
      responses:
        "200":
          description: Accès accordé
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryGrant" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /libraries/{libraryId}/access/{userId}:
    delete:
      operationId: revokeLibraryAccess
      summary: Retirer l'accès d'un compte
      tags: [accounts]
      parameters:
        - $ref: "#/components/parameters/LibraryIdPath"
        - $ref: "#/components/parameters/UserIdPath"
      responses:
        "204":
          description: Accès retiré
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /cache:
    get:
      operationId: getCacheStats
      summary: Occupation du cache dérivé
      tags: [admin]
      responses:
        "200":
          description: Statistiques
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CacheStats" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      operationId: purgeCache
      summary: Vider le cache dérivé
      description: |
        Sans danger : tout le contenu du cache est reconstructible depuis les
        archives d'origine, et une purge ne coûte qu'une régénération à la
        prochaine lecture. Utile après un changement de réglage d'imagerie, ou
        quand on soupçonne des variantes corrompues.
      tags: [admin]
      responses:
        "200":
          description: Cache vidé
          content:
            application/json:
              schema:
                type: object
                required: [entries, bytes]
                properties:
                  entries:
                    type: integer
                    format: int64
                    description: Entrées supprimées.
                  bytes:
                    type: integer
                    format: int64
                    description: Octets libérés.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /storage-backends:
    get:
      operationId: listStorageBackends
      summary: Backends de stockage déclarés
      description: |
        Les identifiants ne sont jamais retournés : ils sont chiffrés en base et
        ne ressortent pas du service.
      tags: [admin]
      responses:
        "200":
          description: Backends
          content:
            application/json:
              schema:
                type: object
                required: [backends]
                properties:
                  backends:
                    type: array
                    items: { $ref: "#/components/schemas/StorageBackend" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      operationId: createStorageBackend
      summary: Déclarer un backend de stockage
      description: |
        Le backend est joint avant d'être enregistré. Un backend injoignable
        n'entre pas en base, où il produirait des scans en échec dont la cause
        serait à chercher ailleurs.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, kind]
              properties:
                name: { type: string }
                kind:
                  type: string
                  enum: [s3, local]
                config:
                  type: object
                  additionalProperties: { type: string }
                  description: |
                    S3 : `endpoint`, `bucket`, `region`, `use_ssl`,
                    `path_style`. Local : `root`.
                secrets:
                  type: object
                  additionalProperties: { type: string }
                  description: |
                    S3 : `access_key`, `secret_key`. Chiffrés en base, jamais
                    relus par l'API.
                isDefault: { type: boolean }
                readOnly: { type: boolean }
      responses:
        "201":
          description: Backend créé
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageBackend" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /storage-backends/{backendId}:
    patch:
      operationId: updateStorageBackend
      summary: Modifier un stockage
      description: |
        Les secrets absents sont **conservés** : corriger un endpoint ne doit pas
        obliger à retaper ses clés, et ne le pourrait pas — elles ne ressortent
        jamais de la base.

        La configuration résultante est jointe avant d'être enregistrée. Valider
        seulement ce qui a été envoyé reviendrait à valider une configuration qui
        n'existera jamais.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/BackendIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                config:
                  type: object
                  additionalProperties: { type: string }
                secrets:
                  type: object
                  additionalProperties: { type: string }
                  description: Omis, les identifiants existants sont conservés.
                readOnly: { type: boolean }
      responses:
        "200":
          description: Stockage modifié
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageBackend" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

    delete:
      operationId: deleteStorageBackend
      summary: Supprimer un stockage
      description: |
        Refusé en 409 tant qu'une bibliothèque s'y appuie : la cascade
        emporterait albums, dossiers, progression de lecture et partages. Le
        refus force à supprimer les bibliothèques d'abord, ce qui rend la perte
        visible et volontaire.

        Les fichiers du stockage ne sont jamais touchés — boxincloud oublie un
        stockage, il ne le vide pas.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/BackendIdPath"
      responses:
        "204":
          description: Stockage supprimé
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Des bibliothèques s'appuient encore sur ce stockage
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /storage-backends/{backendId}/default:
    put:
      operationId: setDefaultStorageBackend
      summary: Désigner le stockage par défaut
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/BackendIdPath"
      responses:
        "204":
          description: Stockage par défaut désigné
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /libraries/{libraryId}:
    patch:
      operationId: updateLibrary
      summary: Modifier une bibliothèque
      description: |
        Changer le préfixe racine ne **déplace rien** : les albums déjà indexés
        pointent des clés construites avec l'ancien. Le changement décrit où
        chercher désormais, et un nouveau parcours reconstruit le catalogue.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/LibraryIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                rootPrefix: { type: string }
      responses:
        "200":
          description: Bibliothèque modifiée
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryDetail" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

    delete:
      operationId: deleteLibrary
      summary: Supprimer une bibliothèque
      description: |
        Albums, dossiers, progression de lecture, favoris, notes et partages
        disparaissent par cascade.

        Les **fichiers** du stockage restent intacts : recréer la bibliothèque
        sur le même préfixe et relancer un parcours les retrouve tous. L'historique
        de lecture, lui, ne revient pas.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/LibraryIdPath"
      responses:
        "204":
          description: Bibliothèque supprimée
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /libraries/{libraryId}/scans:
    get:
      operationId: listScanRuns
      summary: Historique des parcours
      description: |
        Le seul endroit où l'on voit POURQUOI un parcours a échoué. Sans lui, un
        scan en erreur ne se manifeste que par une bibliothèque qui ne se remplit
        pas, sans le moindre indice.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/LibraryIdPath"
      responses:
        "200":
          description: Derniers parcours
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items: { $ref: "#/components/schemas/ScanRun" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /storage-backends/{backendId}/test:
    post:
      operationId: testStorageBackend
      summary: Vérifier qu'un backend répond
      description: |
        Un backend injoignable donne 200 avec `ok: false`. L'échec du test n'est
        pas un échec de la requête : le client a demandé un test, il en reçoit
        le résultat.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/BackendIdPath"
      responses:
        "200":
          description: Résultat du test
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
                  detail: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /libraries/{libraryId}/scan:
    post:
      operationId: scanLibrary
      summary: Relancer un parcours de la bibliothèque
      description: |
        Utile quand des fichiers sont arrivés par un autre chemin que
        l'envoi — un montage réseau, un rsync, un bucket alimenté par ailleurs.

        La réponse est 202 : le parcours est enfilé, pas exécuté. Lister des
        dizaines de milliers d'objets prend des minutes.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/LibraryIdPath"
      responses:
        "202":
          description: Parcours enfilé
          content:
            application/json:
              schema:
                type: object
                required: [queued]
                properties:
                  queued: { type: boolean }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /libraries/{libraryId}/upload:
    post:
      operationId: uploadComic
      summary: Déposer un album dans la bibliothèque
      description: |
        Le corps est lu en flux jusqu'au backend : une archive de plusieurs
        centaines de méga-octets ne transite ni par la mémoire du serveur ni par
        un fichier temporaire.

        **L'ordre des champs compte** : `folder` doit précéder `file`. Le corps
        est consommé partie par partie, sans mise en tampon, si bien qu'un champ
        arrivant après le fichier serait lu trop tard pour peser sur sa
        destination.

        Le contenu est vérifié contre son extension avant écriture : renommer un
        exécutable en `.cbz` ne suffit pas à le déposer dans le bucket.

        Un fichier de même nom déjà présent est refusé plutôt qu'écrasé — la
        progression de lecture est attachée à l'objet, et la remplacer par une
        autre édition la rendrait fausse sans prévenir.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/LibraryIdPath"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                libraryId:
                  type: string
                  format: uuid
                  description: |
                    Bibliothèque de destination, pour l'action `move`. Omise,
                    l'album reste dans la sienne.

                    Changer de bibliothèque peut changer d'espace de stockage :
                    les octets transitent alors par le serveur, faute de copie
                    possible entre deux backends distincts.
                folder:
                  type: string
                  description: |
                    Dossier de destination, relatif au préfixe de la
                    bibliothèque. Vide pour la racine. À envoyer AVANT `file`.
                file:
                  type: string
                  format: binary
                  description: Archive `.cbz`, `.zip`, `.cbr`, `.rar` ou `.pdf`.
            encoding:
              file:
                contentType: application/octet-stream
      responses:
        "201":
          description: Album déposé et mis en file d'indexation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadedComic" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Le dossier de destination est en lecture seule
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "413":
          description: Fichier au-delà de la limite configurée
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /folders:
    get:
      operationId: listFolders
      summary: Arborescence des dossiers
      description: |
        Retourne les dossiers à plat, triés de sorte qu'un parent précède
        toujours ses enfants — le client bâtit l'arbre en une passe, sans
        récursion.

        Les compteurs sont cumulatifs : un dossier affiche le total de sa
        branche, ce qu'attend quelqu'un qui replie un nœud.

        Les dossiers existent en base, ils ne sont plus seulement déduits des
        clés d'objet. Un dossier créé à la main apparaît donc même vide.
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/LibraryId"
      responses:
        "200":
          description: Dossiers
          content:
            application/json:
              schema:
                type: object
                required: [folders]
                properties:
                  folders:
                    type: array
                    items: { $ref: "#/components/schemas/Folder" }
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      operationId: createFolder
      summary: Créer un dossier
      description: |
        Rien n'est écrit dans le stockage : un magasin d'objets n'a pas de
        répertoires, seulement des clés. Le dossier existe donc d'abord dans
        boxincloud, et prendra corps au premier fichier déposé.

        Les dossiers intermédiaires manquants sont créés en passant.
      tags: [catalog]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [libraryId, path]
              properties:
                libraryId: { type: string, format: uuid }
                path:
                  type: string
                  description: |
                    Chemin complet relatif au préfixe de la bibliothèque. Les
                    remontées « .. » sont neutralisées.
      responses:
        "201":
          description: Dossier créé
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Folder" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Le dossier, ou l'un de ses parents, est en lecture seule
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /folders/access:
    post:
      operationId: grantFolderAccess
      summary: Partager un dossier avec un compte
      description: |
        **Attention au modèle**, identique à celui des bibliothèques : un dossier
        SANS aucune autorisation explicite est visible de tous ceux qui voient la
        bibliothèque. Le premier accès accordé le referme donc pour tous les
        autres comptes — le geste restreint autant qu'il ouvre.
      tags: [sharing]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [libraryId, path, userId]
              properties:
                libraryId: { type: string, format: uuid }
                path: { type: string }
                userId: { type: string, format: uuid }
                canWrite: { type: boolean }
      responses:
        "200":
          description: Accès accordé
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FolderGrant" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /libraries/{libraryId}/folders/access:
    get:
      operationId: listFolderAccess
      summary: Comptes autorisés sur un dossier
      tags: [sharing]
      parameters:
        - $ref: "#/components/parameters/LibraryIdPath"
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Accès
          content:
            application/json:
              schema:
                type: object
                required: [grants]
                properties:
                  grants:
                    type: array
                    items: { $ref: "#/components/schemas/FolderGrant" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /libraries/{libraryId}/folders/access/{userId}:
    delete:
      operationId: revokeFolderAccess
      summary: Retirer l'accès d'un compte à un dossier
      tags: [sharing]
      parameters:
        - $ref: "#/components/parameters/LibraryIdPath"
        - $ref: "#/components/parameters/UserIdPath"
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Accès retiré
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /share-links:
    get:
      operationId: listShareLinks
      summary: Liens publics actifs
      description: |
        Les jetons ne sont pas retournés : seul leur hachage est conservé. Un
        lien perdu se remplace, il ne se relit pas.
      tags: [sharing]
      responses:
        "200":
          description: Liens
          content:
            application/json:
              schema:
                type: object
                required: [links]
                properties:
                  links:
                    type: array
                    items: { $ref: "#/components/schemas/ShareLink" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      operationId: createShareLink
      summary: Créer un lien public
      description: |
        Un lien public ouvre un accès **sans compte** : qui a l'URL voit le
        contenu. C'est la seule porte de boxincloud qui ne demande rien, d'où
        quatre garde-fous.

        La portée est exactement un dossier OU un album, jamais une bibliothèque
        entière. L'échéance est obligatoire et plafonnée à un an — un lien sans
        fin finit par circuler plus loin que prévu, et personne ne se souvient de
        le fermer. Le lien est révocable à tout moment. Enfin, un lien sur un
        dossier masqué par un code d'accès est refusé : publier ce qu'on vient de
        cacher n'a aucun sens.

        Le jeton n'est retourné **qu'ici**. Seul son hachage est conservé, comme
        un mot de passe.
      tags: [sharing]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [libraryId, expiresAt]
              properties:
                libraryId: { type: string, format: uuid }
                folderPath:
                  type: string
                  description: Portée dossier. Exclusif avec `comicId`.
                comicId:
                  type: string
                  format: uuid
                  description: Portée album. Exclusif avec `folderPath`.
                label:
                  type: string
                  description: Aide-mémoire, visible de vous seul.
                expiresAt: { type: string, format: date-time }
      responses:
        "201":
          description: Lien créé, jeton inclus
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareLink" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /share-links/{shareId}:
    delete:
      operationId: revokeShareLink
      summary: Révoquer un lien public
      tags: [sharing]
      parameters:
        - name: shareId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Lien révoqué
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /share/{token}:
    get:
      operationId: getSharedContent
      summary: Contenu d'un lien public
      description: |
        **Route publique — aucun compte requis.**

        Retourne exactement ce que le lien désigne, rien d'autre. Un lien
        révoqué, expiré ou inexistant donne 404 dans les trois cas : distinguer
        confirmerait à un inconnu qu'un lien a existé.
      tags: [sharing]
      security: []
      parameters:
        - $ref: "#/components/parameters/ShareToken"
      responses:
        "200":
          description: Contenu partagé
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedContent" }
        "404":
          $ref: "#/components/responses/NotFound"

  /share/{token}/comics/{comicId}/manifest:
    get:
      operationId: getSharedManifest
      summary: Manifeste d'un album partagé
      description: |
        **Route publique.** L'appartenance de l'album à la portée du lien est
        revérifiée à chaque requête : un lien de dossier donne accès à ce que le
        dossier contient MAINTENANT, si bien qu'un album qui en sort cesse
        d'être accessible sans qu'il faille penser à révoquer.
      tags: [sharing]
      security: []
      parameters:
        - $ref: "#/components/parameters/ShareToken"
        - $ref: "#/components/parameters/ComicId"
      responses:
        "200":
          description: Manifeste
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Manifest" }
        "404":
          $ref: "#/components/responses/NotFound"

  /share/{token}/comics/{comicId}/pages/{index}:
    get:
      operationId: getSharedPage
      summary: Page d'un album partagé
      description: "**Route publique.**"
      tags: [sharing]
      security: []
      parameters:
        - $ref: "#/components/parameters/ShareToken"
        - $ref: "#/components/parameters/ComicId"
        - name: index
          in: path
          required: true
          schema: { type: integer, minimum: 0 }
        - name: width
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: |
            Image de la page. Format négocié sur l'en-tête `Accept`, comme sur
            la route authentifiée.
          headers:
            Vary:
              schema: { type: string }
              description: |
                Vaut `Accept`. La réponse dépend des formats déclarés par le
                client : un cache qui l'ignorerait servirait de l'AVIF à qui ne
                sait pas le lire.
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        "404":
          $ref: "#/components/responses/NotFound"

  /share/{token}/comics/{comicId}/cover:
    get:
      operationId: getSharedCover
      summary: Couverture d'un album partagé
      description: "**Route publique.**"
      tags: [sharing]
      security: []
      parameters:
        - $ref: "#/components/parameters/ShareToken"
        - $ref: "#/components/parameters/ComicId"
        - name: width
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: |
            Image de couverture. Format négocié sur l'en-tête `Accept`, comme
            sur la route authentifiée.
          headers:
            Vary:
              schema: { type: string }
              description: |
                Vaut `Accept`. La réponse dépend des formats déclarés par le
                client : un cache qui l'ignorerait servirait de l'AVIF à qui ne
                sait pas le lire.
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
            image/avif:
              schema: { type: string, format: binary }
        "404":
          $ref: "#/components/responses/NotFound"

  /folders/lock:
    put:
      operationId: setFolderLock
      summary: Verrouiller un dossier
      description: |
        Deux verrous indépendants, qui répondent à deux besoins distincts et se
        cumulent librement.

        **Lecture seule** protège d'une fausse manœuvre : le dossier reste
        parfaitement visible, mais ne peut plus être renommé, déplacé, ni recevoir
        ou perdre un album. La protection s'hérite — verrouiller « BD » protège
        tout ce qu'il contient.

        **Code d'accès** masque : le dossier et son contenu disparaissent des
        listages, de la recherche et de l'accès direct tant que le code n'a pas
        été saisi. Un code vide le retire.

        Dans les deux cas de changement de code, les déverrouillages en cours
        sont révoqués : un accès obtenu avec l'ancien code ne survit pas au
        nouveau.
      tags: [catalog]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [libraryId, path]
              properties:
                libraryId: { type: string, format: uuid }
                path: { type: string }
                readOnly: { type: boolean }
                code:
                  type: string
                  description: |
                    Quatre caractères minimum. Ce n'est pas un mot de passe de
                    compte : il ne protège pas l'accès au serveur mais la
                    visibilité d'un dossier pour quelqu'un déjà connecté. Vide
                    pour retirer le code.
      responses:
        "200":
          description: Dossier après verrouillage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Folder" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /folders/unlock:
    post:
      operationId: unlockFolder
      summary: Saisir le code d'accès d'un dossier
      description: |
        Ouvre le dossier pour ce compte, jusqu'à échéance. Le déverrouillage
        n'est pas porté par le jeton d'accès — celui-ci est autoporteur, donc ni
        révocable ni modifiable une fois émis — mais enregistré côté serveur.

        Un code ne contourne pas les droits, il s'y ajoute : l'accès à la
        bibliothèque reste requis.
      tags: [catalog]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [libraryId, path, code]
              properties:
                libraryId: { type: string, format: uuid }
                path: { type: string }
                code: { type: string }
      responses:
        "200":
          description: Dossier déverrouillé
          content:
            application/json:
              schema:
                type: object
                required: [unlockedUntil]
                properties:
                  unlockedUntil: { type: string, format: date-time }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /libraries/{libraryId}/folders/unlock:
    delete:
      operationId: relockFolder
      summary: Refermer un dossier avant échéance
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/LibraryIdPath"
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Dossier refermé
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /folders/path:
    put:
      operationId: relocateFolder
      summary: Renommer ou déplacer un dossier
      description: |
        Renommer et déplacer sont le même geste : le dossier d'un album découle
        de la clé de son objet, si bien que changer le dossier renomme chacun
        des objets qu'il contient — par copie côté serveur quand le backend le
        permet.

        L'opération peut donc durer. Elle est refusée au-delà de deux mille
        albums dans la branche : au-delà, mieux vaut la découper que la subir.

        Un échec en cours de route laisse la branche à moitié déplacée. C'est
        volontaire : défaire des déplacements réussis multiplierait les
        occasions de perdre un fichier, alors qu'un état mixte reste
        entièrement lisible, chaque album pointant la clé où il se trouve.
      tags: [catalog]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [libraryId, path, newPath]
              properties:
                libraryId: { type: string, format: uuid }
                path: { type: string }
                newPath:
                  type: string
                  description: |
                    Nouveau chemin complet. Déplacer un dossier dans sa propre
                    descendance est refusé.
      responses:
        "200":
          description: Dossier après déplacement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Folder" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Le dossier, ou l'un de ses parents, est en lecture seule
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /libraries/{libraryId}/folders:
    delete:
      operationId: deleteFolder
      summary: Supprimer un dossier
      description: |
        Trois degrés, du plus sûr au plus définitif. Sans paramètre, un dossier
        qui contient encore des albums est refusé en 409 : supprimer une branche
        entière ne doit jamais être un geste distrait.

        `deleteComics` retire les albums du catalogue en laissant les fichiers.
        `deleteFiles` les efface aussi, et implique le premier.
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/LibraryIdPath"
        - name: path
          in: query
          required: true
          schema: { type: string }
        - name: deleteComics
          in: query
          description: Retirer aussi les albums du catalogue.
          schema: { type: boolean }
        - name: deleteFiles
          in: query
          description: Effacer aussi les fichiers du stockage. Irréversible.
          schema: { type: boolean }
      responses:
        "200":
          description: Dossier supprimé
          content:
            application/json:
              schema:
                type: object
                required: [removedComics]
                properties:
                  removedComics: { type: integer }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            Le dossier contient encore des albums, ou il est en lecture seule.
            Le champ `type` distingue les deux cas.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /me/marks:
    get:
      operationId: getUserMarks
      summary: Favoris et notes
      description: |
        Groupés délibérément : une grille les affiche ensemble, et deux
        allers-retours pour peupler la même vue seraient du gâchis.
      tags: [catalog]
      responses:
        "200":
          description: Annotations du compte
          content:
            application/json:
              schema:
                type: object
                required: [favorites, ratings]
                properties:
                  favorites:
                    type: array
                    items: { type: string, format: uuid }
                  ratings:
                    type: object
                    additionalProperties: { type: integer }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /comics/bulk:
    post:
      operationId: bulkAction
      summary: Action en lot sur une sélection
      description: |
        Les identifiants sont filtrés sur les bibliothèques visibles avant
        toute écriture : une sélection ne peut pas déborder sur ce à quoi le
        compte n'a pas accès, même si le client envoie des identifiants
        arbitraires.
      tags: [catalog]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, ids]
              properties:
                action:
                  type: string
                  enum: [read, unread, favorite, unfavorite]
                ids:
                  type: array
                  maxItems: 1000
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: Nombre d'éléments affectés
          content:
            application/json:
              schema:
                type: object
                required: [affected]
                properties:
                  affected: { type: integer, format: int64 }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /comics/{comicId}/favorite:
    put:
      operationId: setFavorite
      summary: Mettre ou retirer des favoris
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/ComicId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [favorite]
              properties:
                favorite: { type: boolean }
      responses:
        "200":
          description: État du favori
          content:
            application/json:
              schema:
                type: object
                required: [favorite]
                properties:
                  favorite: { type: boolean }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /comics/{comicId}/rating:
    put:
      operationId: setRating
      summary: Noter un album
      description: Note de 1 à 5. Zéro retire la note.
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/ComicId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: integer, minimum: 0, maximum: 5 }
      responses:
        "200":
          description: Note enregistrée
          content:
            application/json:
              schema:
                type: object
                required: [rating]
                properties:
                  rating: { type: integer }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /comics/{comicId}/folder:
    put:
      operationId: moveComic
      summary: Ranger un album dans un autre dossier
      description: |
        Le dossier d'un album n'est pas une propriété du catalogue : il découle
        de la clé de l'objet dans le backend. Le déplacer renomme donc l'objet,
        par copie côté serveur quand le backend le permet — les octets ne
        transitent jamais par boxincloud.

        Une destination déjà occupée par un fichier du même nom est refusée
        plutôt qu'écrasée.
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/ComicId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [folder]
              properties:
                folder:
                  type: string
                  description: |
                    Dossier de destination, relatif au préfixe de la
                    bibliothèque. Vide pour la racine. Les remontées « .. » sont
                    neutralisées.
      responses:
        "200":
          description: Dossier réel après déplacement
          content:
            application/json:
              schema:
                type: object
                required: [folderPath]
                properties:
                  folderPath: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /comics/manage:
    post:
      operationId: manageComics
      summary: Supprimer ou ranger une sélection
      description: |
        Les identifiants sont filtrés sur ce que le compte peut voir avant toute
        écriture : une sélection ne peut pas déborder sur une bibliothèque
        inaccessible.

        Les échecs individuels n'interrompent pas le lot — sur cinquante albums,
        un objet manquant ne doit pas empêcher les quarante-neuf autres d'être
        traités. Le nombre de réussites est retourné.
      tags: [catalog]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, ids]
              properties:
                action:
                  type: string
                  enum: [delete, move]
                ids:
                  type: array
                  maxItems: 1000
                  items: { type: string, format: uuid }
                folder:
                  type: string
                  description: Destination, pour l'action `move`.
                deleteFile:
                  type: boolean
                  description: |
                    Pour l'action `delete` : supprimer aussi les fichiers du
                    stockage. Faux par défaut.
      responses:
        "200":
          description: Nombre d'albums traités
          content:
            application/json:
              schema:
                type: object
                required: [affected]
                properties:
                  affected: { type: integer }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /comics/{comicId}:
    delete:
      operationId: deleteComic
      summary: Retirer un album
      description: |
        Le fichier est CONSERVÉ par défaut. Retirer un album d'un catalogue se
        rattrape ; effacer un fichier non.

        Sans le fichier, la ligne est marquée comme exclue plutôt que détruite :
        la progression de lecture, les favoris et les notes y sont rattachés, et
        les effacer priverait d'historique quelqu'un qui remettrait le fichier
        en place. Le parcours de bibliothèque respecte cette exclusion et ne
        fait pas réapparaître l'album.

        Avec le fichier, l'objet est supprimé du backend puis la ligne effacée.
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/ComicId"
        - name: deleteFile
          in: query
          description: Supprimer aussi le fichier du stockage. Irréversible.
          schema: { type: boolean }
      responses:
        "204":
          description: Album retiré
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Le dossier, ou l'un de ses parents, est en lecture seule
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }


    patch:
      operationId: editComic
      summary: Corriger les métadonnées
      description: |
        Chaque champ envoyé est appliqué **et verrouillé** : une réindexation ne
        l'écrasera plus. C'est la contrepartie indispensable de l'automatisme —
        sans elle, corriger un titre serait vain.
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/ComicId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                number: { type: string }
                summary: { type: string }
                language: { type: string }
      responses:
        "200":
          description: Album mis à jour
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comic" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    get:
      operationId: getComic
      summary: Détail d'un album
      description: |
        Un album d'une bibliothèque inaccessible répond 404, pas 403 : un 403
        confirmerait son existence à quelqu'un qui n'y a pas droit.
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/ComicId"
      responses:
        "200":
          description: Album
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comic" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Lecture ────────────────────────────────────────────────────────────────

  /comics/{comicId}/manifest:
    get:
      operationId: getManifest
      summary: Manifeste de lecture
      description: |
        Décrit toutes les pages en une requête. Le client obtient les dimensions
        avant la première image et peut réserver la mise en page — ce qui
        supprime le décalage visuel pendant la lecture.
      tags: [reader]
      parameters:
        - $ref: "#/components/parameters/ComicId"
      responses:
        "200":
          description: Manifeste
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Manifest" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/NotIndexed"

  /comics/{comicId}/pages/{index}:
    get:
      operationId: getPage
      summary: Servir une page
      description: |
        Sans `width`, la page d'origine est servie en flux, telle qu'elle est
        stockée dans l'archive. Avec `width`, une variante redimensionnée est
        produite puis mise en cache.

        Une variante est immuable : même album, même page, même largeur donnent
        toujours les mêmes octets. La réponse porte donc un `ETag` et un
        `Cache-Control: immutable`, et une requête conditionnelle
        (`If-None-Match`) répond 304 sans transférer un octet.

        Les balises `<img>` ne pouvant pas porter d'en-tête `Authorization`, le
        jeton d'accès est également accepté dans le paramètre `token`.
      tags: [reader]
      parameters:
        - $ref: "#/components/parameters/ComicId"
        - name: index
          in: path
          required: true
          schema: { type: integer, minimum: 0 }
          description: Numéro de page, 0-based.
        - name: width
          in: query
          schema: { type: integer, minimum: 1 }
          description: Largeur cible. Omise, la page d'origine est servie.
        - $ref: "#/components/parameters/TokenQuery"
      responses:
        "200":
          description: |
            Image de la page, dans le meilleur format que le client déclare
            savoir lire (en-tête `Accept`).

            Le WebP est servi à qui l'annonce, le JPEG à tous les autres — y
            compris à qui n'envoie qu'un joker : « je n'ai rien à déclarer »
            n'est pas « je sais tout lire ».

            L'AVIF n'est **pas** proposé ici, bien qu'il soit produit pour les
            couvertures. Une page se transcode pendant qu'un lecteur attend, et
            l'AVIF réglé pour tenir dans cette attente est à la fois plus lourd
            et plus lent que le WebP.
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string } }
            Vary:
              schema: { type: string }
              description: |
                Vaut `Accept`. La réponse dépend des formats déclarés par le
                client : un cache qui l'ignorerait servirait de l'AVIF à qui ne
                sait pas le lire.
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        "304":
          description: Inchangée depuis la version détenue par le client
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/NotIndexed"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /comics/{comicId}/cover:
    get:
      operationId: getCover
      summary: Vignette de couverture
      description: |
        La largeur demandée est ramenée à l'une des trois tailles générées
        (160, 320, 640) : sans cela, une grille au zoom continu créerait une
        entrée de cache par pixel de largeur.
      tags: [reader]
      parameters:
        - $ref: "#/components/parameters/ComicId"
        - name: width
          in: query
          schema: { type: integer, minimum: 1 }
        - $ref: "#/components/parameters/TokenQuery"
      responses:
        "200":
          description: |
            Vignette, dans le meilleur format que le client déclare savoir lire
            (en-tête `Accept`) : AVIF, sinon WebP, sinon JPEG.

            L'AVIF est proposé ici et pas sur les pages parce que son encodage
            est payé une seule fois par album et par taille, et qu'une grille de
            couvertures est le plus gros transfert de l'application — 62 %
            d'octets en moins qu'en JPEG.
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string } }
            Vary:
              schema: { type: string }
              description: |
                Vaut `Accept`. La réponse dépend des formats déclarés par le
                client : un cache qui l'ignorerait servirait de l'AVIF à qui ne
                sait pas le lire.
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
            image/avif:
              schema: { type: string, format: binary }
        "304":
          description: Inchangée
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Progression ────────────────────────────────────────────────────────────

  /comics/{comicId}/progress:
    get:
      operationId: getProgress
      summary: Progression sur un album
      description: |
        Un album jamais ouvert retourne une progression vide plutôt qu'un 404 :
        le client affiche « non lu » sans avoir à traiter un cas d'erreur.
      tags: [progress]
      parameters:
        - $ref: "#/components/parameters/ComicId"
      responses:
        "200":
          description: Progression
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Progress" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: updateProgress
      summary: Enregistrer une progression
      description: |
        **Règle de résolution de conflit : la page la plus avancée gagne**, sauf
        remise à zéro explicite (`status: unread`).

        C'est ce qu'attend un lecteur : on ne perd jamais sa progression, et
        lire sur tablette puis reprendre sur téléphone reprend au bon endroit.
        Une règle « dernière écriture gagne » ferait régresser la position dès
        que les horloges des appareils divergent.

        `status` est facultatif : omis, il est déduit de la position.
      tags: [progress]
      parameters:
        - $ref: "#/components/parameters/ComicId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProgressUpdate" }
      responses:
        "200":
          description: Progression après résolution
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Progress" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: deleteProgress
      summary: Effacer la progression
      tags: [progress]
      parameters:
        - $ref: "#/components/parameters/ComicId"
      responses:
        "204":
          description: Progression effacée
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /continue-reading:
    get:
      operationId: continueReading
      summary: Albums en cours de lecture
      tags: [progress]
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Albums commencés mais non terminés
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Progress" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /sync:
    get:
      operationId: syncPull
      summary: Récupérer les changements serveur
      description: |
        Synchronisation delta. Le client renvoie le `cursor` de l'appel
        précédent ; à la première synchronisation il l'omet et reçoit tout.

        `hasMore` indique qu'une page est disponible immédiatement : un client
        qui rattrape une longue absence doit boucler sans attendre.
      tags: [progress]
      parameters:
        - name: since
          in: query
          schema: { type: string, format: date-time }
          description: Curseur retourné par un appel précédent. Omis, tout est retourné.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000 }
      responses:
        "200":
          description: Changements
          content:
            application/json:
              schema:
                type: object
                required: [changes, cursor, hasMore]
                properties:
                  changes:
                    type: array
                    items: { $ref: "#/components/schemas/Progress" }
                  cursor:
                    type: string
                    description: À renvoyer au prochain appel.
                  hasMore: { type: boolean }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"

    post:
      operationId: syncPush
      summary: Envoyer les progressions accumulées hors ligne
      description: |
        Chaque écriture passe par la même règle de résolution que les écritures
        en ligne. Rejouer un lot — ce qui arrive quand la réponse se perd — ne
        peut donc pas faire régresser la position ni compter une lecture deux
        fois.

        Au plus 500 mises à jour par requête : un client revenant d'une longue
        absence découpe son rattrapage.
      tags: [progress]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [updates]
              properties:
                updates:
                  type: array
                  maxItems: 500
                  items: { $ref: "#/components/schemas/SyncUpdate" }
      responses:
        "200":
          description: Progressions appliquées
          content:
            application/json:
              schema:
                type: object
                required: [applied, cursor]
                properties:
                  applied:
                    type: array
                    items: { $ref: "#/components/schemas/Progress" }
                  cursor:
                    type: string
                    description: |
                      Permet d'enchaîner sur un pull sans recevoir ce que l'on
                      vient soi-même d'envoyer.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  # ─── Recherche fédérée ──────────────────────────────────────────────────────

  # ─── Module eD2k/Kad ────────────────────────────────────────────────────────

  /ed2k/status:
    get:
      operationId: getEd2kStatus
      summary: État du module eD2k/Kad
      description: |
        Répond toujours, y compris module désactivé ou démon absent : « pas de
        démon déclaré » est un ÉTAT, et le premier qu'une instance fraîche
        connaît. En faire une erreur obligerait l'interface à traiter le cas
        nominal comme une panne.
      tags: [ed2k]
      responses:
        "200":
          description: État courant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ed2kStatus" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /ed2k/events:
    get:
      operationId: streamEd2kEvents
      summary: Flux d'événements du module
      description: |
        Flux Server-Sent Events. Le premier message porte l'état complet, les
        suivants les changements.

        Le protocole External Connections ne pousse rien : les événements sont
        **dérivés** par comparaison d'instantanés successifs du démon. La
        latence d'un événement vaut donc la cadence de scrutation. Voir
        `docs/adr/005-temps-reel-sse-evenements-derives.md`.

        Le jeton est accepté en paramètre d'URL : `EventSource` ne sait pas
        porter d'en-tête `Authorization`.

        À l'étape 0, seul l'événement `status` est émis.
      tags: [ed2k]
      parameters:
        - $ref: "#/components/parameters/TokenQuery"
      responses:
        "200":
          description: Flux ouvert
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Suite de trames SSE. Chaque trame porte un `event:` nommé et
                  un `data:` JSON — pour `status`, un `Ed2kStatus`.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /ed2k/daemon:
    get:
      operationId: getEd2kDaemon
      summary: Démon aMule déclaré
      description: |
        Le mot de passe External Connections n'est jamais retourné : il est
        chiffré en base et ne ressort pas du service, même pour un
        administrateur. Même discipline que les identifiants des backends de
        stockage.
      tags: [ed2k]
      responses:
        "200":
          description: Démon déclaré
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ed2kDaemon" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Ed2kDisabled"
    put:
      operationId: setEd2kDaemon
      summary: Déclarer ou remplacer le démon aMule
      description: |
        L'adresse est contrôlée avant enregistrement : c'est une valeur saisie
        depuis l'interface qui devient une connexion émise **par** le serveur.
        Les adresses d'une installation auto-hébergée — `amuled`,
        `192.168.1.10`, `127.0.0.1` — passent ; celles des services de
        métadonnées d'instance sont refusées.
      tags: [ed2k]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Ed2kDaemonInput" }
      responses:
        "200":
          description: Démon enregistré
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ed2kDaemon" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Ed2kDisabled"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      operationId: forgetEd2kDaemon
      summary: Oublier le démon déclaré
      description: |
        N'arrête pas le démon et ne touche à aucun téléchargement : seule la
        déclaration côté boxincloud disparaît. Oublier un démon absent réussit
        aussi — le résultat demandé est atteint dans les deux cas.
      tags: [ed2k]
      responses:
        "204":
          description: Démon oublié
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Ed2kDisabled"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Jeton d'accès obtenu via `POST /auth/login`. Durée de vie courte
        (15 min par défaut) ; à renouveler avec le refresh token.

  parameters:
    SourceId:
      name: sourceId
      in: path
      required: true
      schema: { type: string, format: uuid }

    ComicId:
      name: comicId
      in: path
      required: true
      schema: { type: string, format: uuid }

    ShareToken:
      name: token
      in: path
      required: true
      schema: { type: string }
      description: Jeton du lien public, tel que reçu à sa création.

    BackendIdPath:
      name: backendId
      in: path
      required: true
      schema: { type: string, format: uuid }

    UserIdPath:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }

    LibraryIdPath:
      name: libraryId
      in: path
      required: true
      schema: { type: string, format: uuid }

    LibraryId:
      name: libraryId
      in: query
      schema: { type: string, format: uuid }
      description: Restreint à une bibliothèque. Omis, toutes les bibliothèques visibles.

    Cursor:
      name: cursor
      in: query
      schema: { type: string }
      description: |
        Valeur `nextCursor` de la page précédente. Opaque : à renvoyer telle
        quelle, jamais à construire.

    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200 }
      description: Nombre d'éléments. Défaut 50, plafond 200.

    TokenQuery:
      name: token
      in: query
      schema: { type: string }
      description: |
        Jeton d'accès, accepté en repli pour les requêtes qui ne peuvent pas
        porter d'en-tête `Authorization` — une balise `<img>`, par exemple.

  schemas:
    BuildInfo:
      type: object
      required: [version, commit, goVersion]
      properties:
        version:
          type: string
          description: Version sémantique, ou "dev" hors release.
        commit:
          type: string
          description: Commit git abrégé.
        goVersion: { type: string }

    User:
      type: object
      required: [id, username, role, restricted]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string }
        displayName: { type: string }
        role:
          type: string
          enum: [admin, user]
        restricted:
          type: boolean
          description: Profil à contenu filtré par classification d'âge.

    DevicePlatform:
      type: string
      enum: [web, android, ios, desktop, unknown]

    Device:
      type: object
      required: [id, name, platform, lastSeenAt, current]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        platform: { $ref: "#/components/schemas/DevicePlatform" }
        appVersion: { type: string }
        lastSeenAt: { type: string, format: date-time }
        current:
          type: boolean
          description: Vrai pour l'appareil ayant émis la requête.

    Tokens:
      type: object
      required: [accessToken, refreshToken, expiresAt, deviceId, user]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresAt:
          type: string
          format: date-time
          description: Expiration du jeton d'accès, pas du refresh token.
        deviceId:
          type: string
          format: uuid
          description: À conserver et à renvoyer aux connexions suivantes.
        user: { $ref: "#/components/schemas/User" }

    Library:
      type: object
      required: [id, name, kind, comicCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind:
          type: string
          enum: [comic, manga, book, mixed]
        comicCount: { type: integer, format: int32 }

    ComicState:
      type: string
      enum: [pending, indexing, ready, hydrating, error]
      description: |
        Seuls les albums `ready` sont lisibles. `error` porte une explication
        dans l'interface d'administration.

    Comic:
      type: object
      required: [id, libraryId, title, format, pageCount, state, fileSize, createdAt, coverPath, fileName, folderPath]
      properties:
        id: { type: string, format: uuid }
        libraryId: { type: string, format: uuid }
        seriesId: { type: string, format: uuid }
        seriesName: { type: string }
        title: { type: string }
        number:
          type: string
          description: |
            Texte, car les numéros réels sont sales — « 3 », « 3.5 », « HS ».
        volume: { type: integer, format: int32 }
        summary: { type: string }
        format:
          type: string
          enum: [cbz, cbr, cb7, pdf, epub]
        pageCount: { type: integer, format: int32 }
        state: { $ref: "#/components/schemas/ComicState" }
        ageRating: { type: integer, format: int32 }
        language: { type: string, description: Code BCP-47. }
        fileSize: { type: integer, format: int64 }
        releasedAt: { type: string, format: date }
        createdAt: { type: string, format: date-time }
        coverPath:
          type: string
          description: |
            Chemin de la couverture. Le client y ajoute `?width=` plutôt que de
            composer l'URL lui-même.
        coverPlaceholder:
          type: string
          description: |
            Aperçu de chargement (LQIP) : data-URI d'une image de 16 px de
            large, à afficher floutée le temps que la couverture arrive.
            Quelques centaines d'octets, livrés avec la liste pour éviter une
            requête supplémentaire.

            Absent tant que l'album n'a pas été indexé par une version qui le
            produit — le client doit gérer son absence.
        fileName:
          type: string
          description: Nom du fichier dans le backend, sans son chemin.
        folderPath:
          type: string
          description: |
            Dossier contenant l'album, relatif au préfixe de la bibliothèque.
            Vide à la racine.

    Series:
      type: object
      required: [id, libraryId, name, comicCount]
      properties:
        id: { type: string, format: uuid }
        libraryId: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        publisher: { type: string }
        comicCount: { type: integer, format: int32 }
        coverComicId: { type: string, format: uuid }
        coverPath: { type: string }

    Account:
      type: object
      required: [id, username, role, restricted, createdAt]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string }
        role: { type: string, enum: [admin, user] }
        displayName: { type: string }
        restricted:
          type: boolean
          description: Profil restreint — base du profil enfant.
        maxAgeRating:
          type: integer
          description: |
            Classification maximale autorisée. Ignorée si le profil n'est pas
            restreint.
        lastLoginAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    LibraryGrant:
      type: object
      required: [libraryId, userId, canWrite]
      properties:
        libraryId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        canWrite: { type: boolean }

    LibraryGrants:
      type: object
      required: [grants]
      properties:
        grants:
          type: array
          items: { $ref: "#/components/schemas/LibraryGrant" }

    FolderGrant:
      type: object
      required: [userId, canWrite]
      properties:
        userId: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        canWrite: { type: boolean }

    ShareLink:
      type: object
      required: [id, libraryId, expiresAt, createdAt, useCount]
      properties:
        id: { type: string, format: uuid }
        libraryId: { type: string, format: uuid }
        folderPath: { type: string }
        comicId: { type: string, format: uuid }
        label: { type: string }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        useCount: { type: integer, format: int64 }
        token:
          type: string
          description: |
            Renseigné UNIQUEMENT à la création. Seul son hachage est conservé :
            il ne peut plus être relu ensuite.

    SharedContent:
      type: object
      required: [scope, expiresAt, comics]
      properties:
        scope: { type: string, enum: [folder, comic] }
        label: { type: string }
        expiresAt: { type: string, format: date-time }
        comics:
          type: array
          items:
            type: object
            required: [id, title, pageCount, coverPath]
            properties:
              id: { type: string, format: uuid }
              title: { type: string }
              seriesName: { type: string }
              number: { type: string }
              pageCount: { type: integer, format: int32 }
              coverPath: { type: string }

    StorageBackend:
      type: object
      required: [id, name, kind, config, isDefault, readOnly, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [s3, local] }
        config:
          type: object
          additionalProperties: { type: string }
        isDefault: { type: boolean }
        readOnly: { type: boolean }
        status:
          type: string
          description: "ok, error, ou vide si jamais testé."

    ScanRun:
      type: object
      required: [id, status, startedAt, objectsSeen, added, updated, removed, errors]
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          description: running, success, failed ou cancelled.
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        objectsSeen: { type: integer }
        added: { type: integer }
        updated: { type: integer }
        removed: { type: integer }
        errors: { type: integer }
        detail:
          type: string
          description: Message d'erreur du parcours, le cas échéant.

    LibraryDetail:
      type: object
      required: [id, backendId, name, kind, rootPrefix, comicCount]
      properties:
        id: { type: string, format: uuid }
        backendId: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string }
        rootPrefix: { type: string }
        comicCount: { type: integer, format: int32 }

    UploadedComic:
      type: object
      required: [comicId, objectKey, title, format, fileSize]
      properties:
        comicId: { type: string, format: uuid }
        objectKey:
          type: string
          description: Clé de l'objet dans le backend.
        title: { type: string }
        format: { type: string, enum: [cbz, cbr, pdf] }
        fileSize: { type: integer, format: int64 }

    Folder:
      type: object
      required: [id, libraryId, path, name, depth, comicCount, explicit, readOnly, hasCode, unlocked]
      properties:
        id: { type: string, format: uuid }
        libraryId: { type: string, format: uuid }
        path:
          type: string
          description: Chemin complet, relatif au préfixe. Vide pour la racine.
        name:
          type: string
          description: Dernier segment du chemin — ce qui s'affiche dans l'arbre.
        depth: { type: integer, description: "0 à la racine." }
        comicCount:
          type: integer
          description: Albums de ce dossier et de ses sous-dossiers.
        explicit:
          type: boolean
          description: |
            Vrai pour un dossier créé à la main, qui survit au fait d'être vide.
            Faux pour un dossier constaté par le parcours, élagué dès qu'il ne
            contient plus rien.
        readOnly:
          type: boolean
          description: Protégé contre les modifications. Ne masque rien.
        hasCode:
          type: boolean
          description: |
            Masqué par un code d'accès. Un dossier masqué non déverrouillé
            n'apparaît pas du tout dans cette liste — ce drapeau ne peut donc
            être vrai que sur un dossier déverrouillé, ou pour un administrateur
            qui vient de poser le code.
        unlocked:
          type: boolean
          description: Le code a été saisi et n'a pas expiré.

    ComicPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Comic" }
        nextCursor:
          type: string
          description: Absent sur la dernière page.

    SeriesPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Series" }
        nextCursor: { type: string }

    CacheStats:
      type: object
      description: |
        Occupation du cache dérivé — vignettes, couvertures, pages transcodées.

        Tout y est reconstructible depuis les archives d'origine : ces chiffres
        décrivent de la place occupée, jamais de la donnée à protéger.
      required: [entries, bytes, hits]
      properties:
        entries: { type: integer, format: int64 }
        bytes: { type: integer, format: int64 }
        hits:
          type: integer
          format: int64
          description: Nombre total de lectures servies depuis le cache.
        maxBytes:
          type: integer
          format: int64
          description: Plafond configuré. Zéro signifie un cache non borné.
        oldestAt: { type: string, format: date-time }
        newestHitAt: { type: string, format: date-time }

    SearchResults:
      type: object
      description: |
        Une recherche retourne deux natures de résultats, jamais fondues en une
        seule liste : chercher « astérix » veut dire la série pour qui la
        parcourt, et un tome précis pour qui le cherche. Les mêler classerait
        l'un devant l'autre au lieu de laisser choisir.
      required: [comics, series]
      properties:
        comics:
          type: array
          items: { $ref: "#/components/schemas/Comic" }
        series:
          type: array
          items: { $ref: "#/components/schemas/Series" }

    Manifest:
      type: object
      required: [comicId, pageCount, pages]
      properties:
        comicId: { type: string, format: uuid }
        pageCount: { type: integer, format: int32 }
        pages:
          type: array
          items: { $ref: "#/components/schemas/ManifestPage" }

    ManifestPage:
      type: object
      required: [index, isDouble]
      properties:
        index: { type: integer, format: int32 }
        width:
          type: integer
          format: int32
          description: Absente si l'image n'a pas pu être analysée.
        height: { type: integer, format: int32 }
        isDouble:
          type: boolean
          description: |
            Double planche détectée au ratio. Le lecteur l'affiche seule en mode
            double page, sans l'apparier avec une voisine.

    ReadStatus:
      type: string
      enum: [unread, in_progress, read]

    Progress:
      type: object
      required: [comicId, page, pageCount, percent, status, readCount, version, updatedAt]
      properties:
        comicId: { type: string, format: uuid }
        page:
          type: integer
          format: int32
          description: Dernière page lue, 0-based.
        pageCount:
          type: integer
          format: int32
          description: |
            Copie du nombre de pages au moment de la lecture. Reste cohérente
            même si l'album est remplacé par une version au découpage différent.
        percent: { type: number, format: double }
        status: { $ref: "#/components/schemas/ReadStatus" }
        readCount:
          type: integer
          format: int32
          description: Nombre de lectures complètes.
        version:
          type: integer
          format: int64
          description: Incrémenté à chaque écriture.
        deviceId: { type: string, format: uuid }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ProgressUpdate:
      type: object
      required: [page, pageCount]
      properties:
        page: { type: integer, format: int32, minimum: 0 }
        pageCount: { type: integer, format: int32, minimum: 0 }
        status:
          allOf:
            - $ref: "#/components/schemas/ReadStatus"
          description: Facultatif — déduit de la position s'il est omis.
        deviceId:
          type: string
          format: uuid
          description: Facultatif — le jeton porte déjà l'appareil.

    SyncUpdate:
      allOf:
        - type: object
          required: [comicId]
          properties:
            comicId: { type: string, format: uuid }
        - $ref: "#/components/schemas/ProgressUpdate"

    Ed2kStatus:
      type: object
      description: État du module eD2k/Kad, tel qu'affiché en tête de l'interface.
      required: [enabled, state, detail, incomingDir]
      properties:
        enabled:
          type: boolean
          description: |
            Reflète la configuration de déploiement
            (`BOXINCLOUD_ED2K_ENABLED`), pas l'état de la connexion.
        state:
          $ref: "#/components/schemas/Ed2kState"
        detail:
          type: string
          description: |
            Pourquoi le module est dans cet état, en clair. Un état sans raison
            oblige à chercher ailleurs ce que le serveur sait déjà.
        daemon:
          $ref: "#/components/schemas/Ed2kDaemon"
        incomingDir:
          type: string
          description: |
            Répertoire d'arrivée du démon, tel que ce serveur le voit. Exposé
            parce qu'un montage manquant est la première cause de
            « le téléchargement est fini mais rien n'arrive ».

    Ed2kState:
      type: string
      description: |
        Situation du module.

        L'énumération est complète dès maintenant, y compris les valeurs qu'une
        instance ne produit pas encore : ajouter une valeur à une énumération de
        réponse casse un client strict, et la déclarer d'avance évite d'imposer
        cette rupture plus tard.
      enum:
        - disabled
        - unconfigured
        - disconnected
        - connecting
        - connected

    Ed2kDaemon:
      type: object
      description: |
        Démon aMule déclaré. Ne porte jamais le mot de passe External
        Connections — il est chiffré en base et ne ressort pas du service.
      required: [host, port]
      properties:
        host:
          type: string
          description: Adresse joignable **depuis le serveur**, pas depuis le navigateur.
        port: { type: integer, minimum: 1, maximum: 65535 }
        label:
          type: string
          description: Nom libre, pour distinguer deux instances dans les journaux.
        lastState:
          $ref: "#/components/schemas/Ed2kState"
        lastDetail:
          type: string
          description: Raison du dernier état constaté.
        lastSeenAt:
          type: string
          format: date-time
          description: |
            Dernière réponse effective du démon. N'est pas rafraîchi par un
            échec, sans quoi l'interface afficherait « vu à l'instant » pour un
            démon injoignable depuis une heure.

    Ed2kDaemonInput:
      type: object
      required: [host, port, password]
      properties:
        host:
          type: string
          minLength: 1
          description: |
            `amuled` sur un réseau interne, ou l'adresse d'un aMule déjà
            installé. Contrôlée avant enregistrement.
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: Port External Connections du démon. 4712 par défaut chez aMule.
        password:
          type: string
          minLength: 1
          description: |
            Mot de passe External Connections. Chiffré en base avec la clé
            maître de l'instance ; jamais retourné.
        label:
          type: string

    Problem:
      type: object
      description: |
        Erreur au format RFC 9457, servie avec le type MIME
        `application/problem+json`.
      required: [type, title, status]
      properties:
        type:
          type: string
          description: Identifiant stable de la catégorie d'erreur.
        title: { type: string }
        status: { type: integer }
        detail:
          type: string
          description: Explication de ce cas précis, affichable à l'utilisateur.
        instance:
          type: string
          description: |
            Identifiant de la requête. À inclure dans un rapport de bug pour
            retrouver la trace côté serveur.
        errors:
          type: object
          additionalProperties: { type: string }
          description: Champs invalides, pour les erreurs de validation.

  responses:
    BadRequest:
      description: Requête malformée
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

    Unauthorized:
      description: Jeton absent, expiré ou invalide
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

    Forbidden:
      description: Droits insuffisants
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

    NotFound:
      description: Ressource introuvable
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

    ValidationFailed:
      description: Validation échouée
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

    NotIndexed:
      description: L'album n'a pas fini d'être indexé
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

    Ed2kDisabled:
      description: |
        Le module eD2k est désactivé sur cette instance
        (`BOXINCLOUD_ED2K_ENABLED=false`). Un 409 plutôt qu'un 404 : la route
        existe et existera encore une fois le module activé.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

